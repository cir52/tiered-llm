[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tiered-llm"
version = "0.1.0"
description = "Production plumbing for multi-provider LLM systems: per-provider circuit breakers, fallback chains, cheap-then-expensive cascades and an append-only decision log."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ronald Neubert" }]
keywords = ["llm", "circuit-breaker", "fallback", "ollama", "anthropic", "gemini", "openai", "deepseek", "llm-routing", "resilience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/cir52/tiered-llm"
Author = "https://ronaldneubert.vercel.app"

[tool.hatch.build.targets.wheel]
packages = ["src/tiered_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# README snippets are hand-aligned for reading, not formatter output.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
